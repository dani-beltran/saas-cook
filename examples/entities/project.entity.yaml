# Proposed common-sass CLI input. Illustrative specification; no generator exists yet.
specVersion: 1

entity:
  name: Project
  plural: Projects
  key: project
  module: projects
  table: projects
  route: projects
  scope: organization

systemFields:
  id: uuid
  organizationId: fromVerifiedContext
  timestamps: true
  actorTracking: true
  optimisticConcurrency: true
  softDelete: true

fields:
  name:
    type: string
    required: true
    minLength: 1
    maxLength: 160
    trim: true
    create: true
    update: true
    read: true
    searchable: true
    export: true
  slug:
    type: string
    required: true
    minLength: 1
    maxLength: 100
    pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    create: true
    update: false
    read: true
    export: true
  description:
    type: text
    nullable: true
    maxLength: 10000
    create: true
    update: true
    read: true
    export: false
  status:
    type: enum
    values: [draft, active, archived]
    default: draft
    create: true
    update: true
    read: true
    filterable: true
    export: true

indexes:
  - name: projects_org_slug_unique
    fields: [organizationId, slug]
    unique: true
    # Slugs remain reserved through soft deletion; restore cannot collide.
  - name: projects_org_created_id
    fields: [organizationId, createdAt, id]
  - name: projects_org_status_created_id
    fields: [organizationId, status, createdAt, id]

authorization:
  template: resource-shared
  requireActiveOrganizationPrincipal: true
  crossOrganizationSharing: false
  createPermission: organization.project_create
  grantCreator: manager
  relations:
    viewer: [membership, team]
    editor: [membership, team]
    manager: [membership, team]
  permissions:
    read: project.read
    update: project.update
    delete: project.delete
    restore: project.restore
    share: project.share
  organizationAdminPolicy: manageAll

commercial:
  entitlement: projects.enabled
  quota:
    feature: projects.max_active
    kind: capacity
    # Capacity counts all non-deleted rows, including status=archived.
    countPredicate: notSoftDeleted
    reserveOn: [create, restore]
    releaseOn: [softDelete]
    hardDeleteAfterSoftDelete: noAdditionalRelease

audit:
  enabled: true
  actions: [create, update, softDelete, restore, share]
  changeFields: [name, slug, status]

events:
  schemaVersion: 1
  names: [project.created, project.updated, project.deleted, project.restored, project.shared]
  payloadFields: [id, organizationId, version]

api:
  expose: true
  version: v1
  operations: [list, create, read, update, delete, restore, share]
  idempotentCreate: true
  expectedVersionOnUpdate: true
  pagination:
    style: authorizedCursorScan
    defaultLimit: 25
    maxLimit: 100
  sorts: [createdAt, name]
  defaultSort: createdAt_desc

ui:
  navigation:
    label: Projects
    icon: FolderKanban
    requiredPermission: organization.project_list
  pages: [list, create, detail, edit]
  columns: [name, status, createdAt]
  filters: [status]
  form:
    name: text
    slug: slug
    description: textarea
    status: select
  emptyState:
    title: No projects yet
    description: Create a project to organize your work.
    action: Create project

hooks:
  customRules: packages/modules/projects/src/custom/project.rules.ts
  customHooks: packages/modules/projects/src/custom/project.hooks.ts

tests:
  required:
    - tenantIsolation
    - relationPermissions
    - revocationWhileProjectionDelayed
    - fieldAllowlist
    - idempotentCreate
    - concurrentQuota
    - optimisticConcurrency
    - softDeleteAndRestore
    - auditAndOutboxAtomicity
    - dashboardCrud

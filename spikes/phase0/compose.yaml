name: common-sass-phase0
services:
  postgres:
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: phase0
      POSTGRES_DB: phase0
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["./database/init.sql:/docker-entrypoint-initdb.d/00-phase0.sql:ro"]
    tmpfs: ["/var/lib/postgresql:size=8g"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phase0"]
      interval: 2s
      timeout: 2s
      retries: 30
  fga-migrate:
    image: openfga/openfga:v1.21.0@sha256:2113c664a486b5da8d7a2cdab479e0d4e30639c80fd2c000540f645c1dbc1e55
    depends_on:
      postgres: {condition: service_healthy}
    command: ["migrate"]
    environment: &fga-env
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://postgres:phase0@postgres:5432/phase0_fga?sslmode=disable
  openfga:
    image: openfga/openfga:v1.21.0@sha256:2113c664a486b5da8d7a2cdab479e0d4e30639c80fd2c000540f645c1dbc1e55
    depends_on:
      fga-migrate: {condition: service_completed_successfully}
    command: ["run"]
    environment:
      <<: *fga-env
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_LOG_LEVEL: error
      OPENFGA_DATASTORE_MAX_OPEN_CONNS: "30"
    ports: ["127.0.0.1:18080:8080"]
